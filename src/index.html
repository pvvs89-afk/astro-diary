<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Astro Diary</title>

    <base href="/" />

    <!-- "only": stops phone browsers (Chrome / Samsung dark mode) from darkening the app; the chosen theme decides. -->
    <meta name="color-scheme" content="only light" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/svg+xml" href="assets/logo/astro-diary-icon.svg" />
    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icon/favicon.png" />
    <meta name="theme-color" content="#D9580B" />

    <!-- Theme fonts (free Google Fonts). Without internet the app falls back to system fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Baloo+Chettan+2:wght@400;500;600;700&family=Baloo+Tammudu+2:wght@400;500;600;700&family=Baloo+Thambi+2:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Outfit:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yeseva+One&display=swap"
    />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
