# Builds the app and publishes it to https://app.<server-domain> on every push to main.
#
# Repo secrets needed (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST  - server static IP
#   DEPLOY_KEY   - contents of /root/deploy_key on the server
name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx ng build --configuration production

      - name: SSH key
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload
        run: rsync -az --delete www/ astro@${{ secrets.DEPLOY_HOST }}:/opt/astro/app/
